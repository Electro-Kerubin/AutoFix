services:
  db:
    image: postgres:17-alpine
    container_name: autofix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-autofix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autofix_dev}
      POSTGRES_DB: ${DB_NAME:-autofix}
      TZ: America/Santiago
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - autofix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autofix} -d ${DB_NAME:-autofix}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autofix_pgdata:
