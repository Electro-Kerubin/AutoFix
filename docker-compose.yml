services:
  backend:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-autofix}
      DB_PASSWORD: ${DB_PASSWORD:-autofix_dev}
      DB_NAME: ${DB_NAME:-autofix}
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./Backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: autofix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-autofix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autofix_dev}
      POSTGRES_DB: ${DB_NAME:-autofix}
      TZ: America/Santiago
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - autofix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autofix} -d ${DB_NAME:-autofix}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autofix_pgdata:
