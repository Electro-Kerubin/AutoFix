server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Evidencias fotográficas de las OT.
  client_max_body_size 20m;

  # La API vive en el contenedor "backend"; así el navegador usa un único origen (sin CORS).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Archivos con hash: cache largo. El resto (index.html) siempre se revalida.
  location ~* \.(js|css|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Aplicación Angular: cualquier ruta del navegador (/ordenes, /portal/<token>) entrega index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
